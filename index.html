<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMNA People — HR Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --online: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .badge {
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--online);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .card h2 { font-size: 1.15rem; margin-bottom: 1rem; }
    .chat-box {
      height: 320px;
      overflow-y: auto;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .msg {
      max-width: 82%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .input-row { display: flex; gap: 0.5rem; }
    input[type="text"] {
      flex: 1;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.4rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn-link {
      flex: 1;
      min-width: 200px;
      text-align: center;
      text-decoration: none;
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.9rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-link:hover { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>OMNA People</h1>
        <p>Ask HR, get interview coaching, and apply. Built with n8n.</p>
      </div>
      <span id="statusBadge" class="badge">Online</span>
    </header>

    <section class="card">
      <h2>Ask HR</h2>
      <div id="chatBox" class="chat-box">
        <div class="msg bot">Welcome! Ask me any questions regarding human resources and leave policies.</div>
      </div>
      <form id="chatForm" class="input-row">
        <input id="questionInput" type="text" placeholder="How many leave days do I get?" required />
        <button id="sendBtn" type="submit">Ask</button>
      </form>
    </section>

    <section class="card">
      <h2>Apply or get coached</h2>
      <div class="actions">
        <a id="applyLink" class="btn-link" target="_blank" rel="noopener">Apply for a job</a>
        <a id="coachLink" class="btn-link" target="_blank" rel="noopener">Get a coaching report</a>
      </div>
    </section>
  </div>

  <script>
    const CONFIG = {
      n8nBase: "https://fax-snide-semisweet.ngrok-free.dev",
      chat: "https://fax-snide-semisweet.ngrok-free.dev/webhook/0c4e52e2-6517-48e9-9619-a048bebe4d53/chat",
      applyForm: "https://fax-snide-semisweet.ngrok-free.dev/form/4291160f-7d7d-48cd-92b0-bc8684992f37",
      coachForm: "https://fax-snide-semisweet.ngrok-free.dev/form/78132e28-3970-44c7-8ce8-03d4b74ee635"
    };

    document.getElementById("applyLink").href = CONFIG.n8nBase + CONFIG.applyForm;
    document.getElementById("coachLink").href = CONFIG.n8nBase + CONFIG.coachForm;

    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");

    const sessionId = "session-" + Math.random().toString(36).substring(2, 10);

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = questionInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      questionInput.value = "";
      sendBtn.disabled = true;
      const loadingMsg = addMessage("I'm thinking...", "bot");

      try {
        const response = await fetch(CONFIG.n8nBase + CONFIG.chat, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
          },
          body: JSON.stringify({
            chatInput: text,
            sessionId: sessionId
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        const reply = data.output || data.text || data.response || JSON.stringify(data);
        loadingMsg.textContent = reply;
      } catch (err) {
        loadingMsg.textContent = "Server connection error. Please ensure that n8n and ngrok are working.";
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
